<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{ ctx.csrf }}">
<title>{% block title %}Operune Root Admin{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; }
  nav { display: flex; gap: 1rem; align-items: center; padding: 0.75rem 1rem;
        border-bottom: 1px solid #888; }
  nav a { text-decoration: none; }
  nav .user { margin-left: auto; color: #666; }
  nav form { display: inline; margin: 0; }
  main { padding: 1rem; max-width: 72rem; }
  table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
  th, td { border: 1px solid #aaa; padding: 0.3rem 0.5rem; text-align: left;
           font-size: 0.9rem; word-break: break-all; }
  th { background: #eee; }
  textarea, input[type=file], input[type=text], input[type=password] { width: 100%; }
  .ok { color: #1a7f37; } .err { color: #c62828; } .warn { color: #b45309; }
  .inline { display: inline; }
  code { font-size: 0.85em; }
</style>
</head>
<body>
<nav>
  <a href="/">Status</a>
  <a href="/components">Components</a>
  <a href="/grants">Grants</a>
  <a href="/users">Users</a>
  <a href="/config">Config</a>
  <a href="/audit">Audit</a>
  <a href="/safe-mode">Safe mode</a>
  <span class="user">logged in as {{ ctx.subject }}</span>
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="_csrf" value="{{ ctx.csrf }}">
    <button type="submit">Log out</button>
  </form>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
