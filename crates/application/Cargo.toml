[package]
name = "operune-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Operune application layer: use-case orchestration and ports (spec 24.2)"

[dependencies]
# §24.3 依赖方向：adapters ---> application ---> domain。
# application 不得知道 SQLite / Axum / WASI p2 具体类型（§24.2）；它依赖
# domain（纯领域类型）与 workspace member runtime-wasm / runtime-wasi-p2
# 的项目自有 typed API（§8.2 只禁止 wasmtime_wasi::p2/p3 具体类型与
# SQLite/Axum 类型，不禁止这些 member crate 的 typed port 面）。
operune-domain = { path = "../domain" }
operune-runtime-wasm = { path = "../runtime-wasm" }
operune-runtime-wasi-p2 = { path = "../runtime-wasi-p2" }
# 0.3.0 SecretService（§41.2 / §16.6 / ADR-0001）：security 是底层能力库
# （SecretCipher / SecretBytes / 密文 envelope），不依赖 application，
# 依赖方向 application → security 合理（§24.3）。SecretStore port 本身
# 不含明文——加解密永远经 security 层。
operune-security = { path = "../security" }

# §22.2 Wasmtime 36.x LTS（同一 release line）。
# 最小 production feature 集（§22.2）：component-model（Component API 与
# bindgen! 宏）、runtime（Store/Instance/Func/Val 执行类型）、std。
# 不启用 cranelift / async / wat：Engine 由 runtime-wasm 创建（其已启用
# cranelift + parallel-compilation），本 crate 只做 Host binding 集成；
# cranelift/wat 仅出现在 dev-dependencies（测试需要本地 Engine 与文本格式）。
wasmtime = { workspace = true, default-features = false, features = [
    "component-model",
    "runtime",
    "std",
] }

# §22.5 / §14.1：typed error 契约。
thiserror = { workspace = true }
# §22.4：用例级记录的内部持久/配置边界序列化（storage 适配层需要）。
serde = { workspace = true, features = ["derive"] }
# §15.5 / §20.3：read-mostly 不可变 Active 快照 + 原子切换（arc-swap）。
arc-swap = { workspace = true }
# 0.3.0 scheduler/event/lifecycle（§41.2 / §15）：tokio 是 native async
# runtime（§15.1）——driver/pump/consumer 后台任务（rt）、有界队列与
# watch 唤醒通道（sync，§15.2 无丢失唤醒）、定时器驱动（time）。
# feature 最小集：rt + sync + time + macros（select! 宏；不使用
# net/io 等生产 feature）。
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
# 0.3.0 operune:secret import 接线（§41.2 / §16.6）：read-secret 的宿主
# 闭包把 SecretBytes 明文编入 Val 返回值——明文取用入口是
# secrecy::ExposeSecret（security 层对 SecretBytes 的实现，
# ADR-0001 §16.6 进程内暴露面）。取值发生在 canonical ABI 边界（值立即
# 编码进 Val 写入 guest 内存，不进入日志/审计/错误），该 trait 必须在本
# crate 作用域内。secrecy 是 §22.6 冻结 workspace 基线既有条目（security
# crate 已采用），本条目是 application 对同一冻结依赖的采用，无新增
# workspace 条目（§23 无需 Gate）。
secrecy = { workspace = true }

[dev-dependencies]
# §22.8 test/dev-only：真实 wasmtime 集成测试需要本地 JIT 后端（cranelift）
# 与 wat 文本格式解析（构造最小 Component fixture）。
wasmtime = { workspace = true, features = ["cranelift", "wat"] }
# §22.4：audit 事件序列化的测试断言（§16.6 不记 secret 的证明）。
serde_json = { workspace = true }
# §22.5：0.2.0 composition 测试的确定性 InstallationId（seed → uuid，
# 与 domain 测试同模式；从既有 workspace 基线取值，不新增依赖）。
uuid = { workspace = true }
# 0.3.0 storage 接线端到端测试（§41.2 port 契约与真实 executor 的形态
# 对齐验证）：storage-sqlite 实现 application 的 port traits（dev 依赖
# 方向与 §24.3 生产依赖方向相反，仅测试目标使用，不进入生产构建图）。
# tokio 经 storage-sqlite 的既有 feature（rt/sync/macros/time）统一启用；
# tempfile 提供真实 executor 的隔离 data root（§22.8 冻结清单已有）。
operune-storage-sqlite = { path = "../storage-sqlite" }
# test-util：确定性时间测试（start_paused / tokio::time::advance，§15.1
# scheduler/event 的时间控制；仅测试目标使用）。
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# §22.8 / §16.6：secret 测试断言需要 ExposeSecret（明文比较入口；security
# 的 SecretBytes 的 expose_secret 由 secrecy trait 提供）。
secrecy = { workspace = true }

[lints]
workspace = true
